<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1E24">
<title>Daily Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1E24; --surface:#20242C; --surface-2:#262B34; --border:#343A45;
    --text:#E7E5E0; --text-dim:#9AA1AC; --accent-blue:#6E93B7; --accent-green:#7FAE7A;
    --accent-amber:#D6A85C; --danger:#C97064;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .top h1{font-size:1.15rem;font-weight:600;margin:0 0 4px;letter-spacing:0.01em;}
  .top .date{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--text-dim);}
  .score{text-align:right;}
  .score .num{font-family:'IBM Plex Mono',monospace;font-size:2.2rem;font-weight:600;line-height:1;color:var(--accent-green);}
  .score .label{font-size:0.72rem;color:var(--text-dim);margin-top:2px;}
  .nav-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:0.78rem;color:var(--text-dim);}
  .nav-row button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 10px;font-size:0.75rem;cursor:pointer;}
  .nav-row button:hover{border-color:var(--accent-blue);}
  .nav-row button:disabled{opacity:0.35;cursor:default;}
  .badge{background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;}
  .badge.readonly{color:var(--accent-amber);}
  .stat-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-chip{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;}
  .stat-chip .v{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent-amber);}
  .stat-chip .k{font-size:0.7rem;color:var(--text-dim);}
  .section-label{font-size:0.78rem;color:var(--text-dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .section-label .link{color:var(--accent-blue);cursor:pointer;font-size:0.72rem;background:none;border:none;padding:0;}
  .tasks{border-top:1px solid var(--border);margin-bottom:10px;}
  .task{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);}
  .task .box{width:18px;height:18px;border:1.5px solid var(--text-dim);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
  .task .box.done{background:var(--accent-green);border-color:var(--accent-green);}
  .task .box.disabled{cursor:default;opacity:0.6;}
  .task .box.done::after{content:"";width:5px;height:9px;border-right:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(45deg) translate(-1px,-1px);}
  .task .name{flex:1;font-size:0.92rem;cursor:pointer;}
  .task .name.done{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}
  .task .tag{font-size:0.65rem;color:var(--text-dim);border:1px solid var(--border);padding:1px 6px;}
  .task .del{color:var(--text-dim);background:none;border:none;cursor:pointer;font-size:0.85rem;padding:4px 6px;opacity:0;transition:opacity .15s, color .15s;}
  .task:hover .del{opacity:1;}
  .task .del:hover{color:var(--danger);}
  @media (hover:none){ .task .del{opacity:1;} }
  .order-btns{display:flex;flex-direction:column;gap:0;}
  .order-btns button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.65rem;line-height:1;padding:2px;}
  .order-btns button:hover{color:var(--accent-blue);}
  .add-row{display:flex;gap:8px;padding:12px 2px 2px;}
  .add-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;}
  .add-row input:focus{outline:1px solid var(--accent-blue);}
  .add-row button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 16px;font-size:0.85rem;cursor:pointer;}
  .add-row button:hover{border-color:var(--accent-blue);}
  .past-note{padding:12px 2px;color:var(--text-dim);font-size:0.78rem;}
  .empty{padding:20px 2px;color:var(--text-dim);font-size:0.88rem;}
  .archived-list{margin:8px 0 20px;}
  .archived-list .task{opacity:0.7;}
  .archived-list .restore{color:var(--accent-blue);background:none;border:none;cursor:pointer;font-size:0.75rem;}
  .heatmap-wrap{overflow-x:auto;padding-bottom:4px;}
  .heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;}
  .cell{width:12px;height:12px;cursor:pointer;}
  .cell.future{cursor:default;}
  .cell.selected{outline:1.5px solid var(--accent-blue);outline-offset:1px;}
  .legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:0.7rem;color:var(--text-dim);}
  .legend .cell{width:10px;height:10px;cursor:default;}
  .panel{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);}
  .panel-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .panel-toggle .section-label{margin:0;}
  .panel-body{margin-top:12px;font-size:0.85rem;color:var(--text-dim);}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:0.85rem;}
  .settings-row input[type="number"]{width:60px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 6px;font-family:'IBM Plex Mono',monospace;}
  .backup-row{display:flex;gap:8px;margin-top:4px;}
  .backup-row button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:0.8rem;cursor:pointer;}
  .backup-row button:hover{border-color:var(--accent-blue);}
  .saved-note{font-size:0.68rem;color:var(--text-dim);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .install-hint{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:0.75rem;color:var(--text-dim);display:none;}
  .install-hint.show{display:block;}
  .install-hint button{background:none;border:1px solid var(--accent-blue);color:var(--accent-blue);padding:6px 12px;font-size:0.75rem;cursor:pointer;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="import-file" accept="application/json" style="display:none">

<script>
const STORAGE_KEY = 'daily-tracker-data';
let data = { tasks: [], completions: {}, settings: { threshold: 0.8, graceDay: true }, updatedAt: 0 };
let showSync = false;
let sync = { token:'', gistId:'' };
let syncStatus = '';
let syncTimer = null;
const GIST_FILE = 'daily-tracker.json';
let viewingDate = todayKey();
let showArchived = false;
let showSettings = false;
let showBackup = false;
let lastSavedAt = null;
let deferredPrompt = null;

function todayKey(){ return formatKey(new Date()); }
function formatKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }
function daysBetween(key1, key2){ return Math.round((parseKey(key2)-parseKey(key1))/86400000); }
function dateLabelFor(key){ return parseKey(key).toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}); }
function isEditable(key){ const diff = daysBetween(key, todayKey()); return diff>=0 && diff<=6; }

function normalize(d){
  if(!d.tasks) d.tasks = [];
  if(!d.completions) d.completions = {};
  if(!d.settings) d.settings = { threshold: 0.8, graceDay: true };
  if(!d.updatedAt) d.updatedAt = 0;
  d.tasks.forEach((t,i) => { if(t.order===undefined) t.order = i; if(t.archived===undefined) t.archived=false; });
  return d;
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ data = normalize(JSON.parse(raw)); }
  }catch(e){}
}
function save(){
  try{ data.updatedAt = Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); lastSavedAt = new Date(); }
  catch(e){ console.error(e); }
  scheduleSync();
}

/* ---------- Sync via private GitHub Gist ---------- */
function loadSyncConfig(){ try{ const raw=localStorage.getItem('daily-tracker-sync'); if(raw) sync=JSON.parse(raw); }catch(e){} }
function saveSyncConfig(){ localStorage.setItem('daily-tracker-sync', JSON.stringify(sync)); }
function ghFetch(path, opts){
  opts = opts || {};
  return fetch('https://api.github.com'+path, Object.assign({}, opts, { headers:{ 'Authorization':'Bearer '+sync.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' } }));
}
async function findGist(){
  for(let page=1; page<=5; page++){
    const r = await ghFetch('/gists?per_page=100&page='+page);
    if(!r.ok) throw new Error('GitHub '+r.status);
    const list = await r.json();
    const g = list.find(g => g.files && g.files[GIST_FILE]);
    if(g) return g.id;
    if(list.length < 100) break;
  }
  return null;
}
async function pullGist(){
  const r = await ghFetch('/gists/'+sync.gistId);
  if(!r.ok) throw new Error('GitHub '+r.status);
  const g = await r.json();
  const f = g.files && g.files[GIST_FILE];
  if(!f) return null;
  let content = f.content;
  if(f.truncated){ content = await (await fetch(f.raw_url)).text(); }
  return JSON.parse(content);
}
async function pushGist(){
  const content = JSON.stringify(data);
  if(sync.gistId){
    const r = await ghFetch('/gists/'+sync.gistId, { method:'PATCH', body: JSON.stringify({ files:{ [GIST_FILE]:{ content } } }) });
    if(!r.ok) throw new Error('GitHub '+r.status);
  } else {
    const r = await ghFetch('/gists', { method:'POST', body: JSON.stringify({ description:'Daily Tracker data', public:false, files:{ [GIST_FILE]:{ content } } }) });
    if(!r.ok) throw new Error('GitHub '+r.status);
    sync.gistId = (await r.json()).id; saveSyncConfig();
  }
}
function setSyncStatus(msg){
  syncStatus = msg;
  const el = document.getElementById('sync-status');
  if(el) el.textContent = msg;
}
function scheduleSync(){
  if(!sync.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 2000);
}
async function syncNow(){
  if(!sync.token) return;
  setSyncStatus('syncing…');
  try{
    if(!sync.gistId){ sync.gistId = (await findGist()) || ''; saveSyncConfig(); }
    if(sync.gistId){
      const remote = await pullGist();
      if(remote && remote.tasks && (remote.updatedAt||0) > (data.updatedAt||0)){
        data = normalize(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setSyncStatus('pulled newer data at '+new Date().toLocaleTimeString());
        render(); return;
      }
    }
    await pushGist();
    setSyncStatus('synced at '+new Date().toLocaleTimeString());
  }catch(e){ setSyncStatus('sync failed: '+e.message); }
}

function activeTasks(){ return data.tasks.filter(t=>!t.archived).sort((a,b)=>a.order-b.order); }
function archivedTasks(){ return data.tasks.filter(t=>t.archived); }
function tasksForDate(key){
  const done = data.completions[key] || {};
  return data.tasks.filter(t => !t.archived || done[t.id]).sort((a,b)=>a.order-b.order);
}
function scoreForDate(key){
  const list = tasksForDate(key);
  if(list.length===0) return null;
  const done = data.completions[key] || {};
  const completed = list.filter(t=>done[t.id]).length;
  return completed/list.length;
}

function addTask(name){
  name = name.trim();
  if(!name) return;
  const maxOrder = data.tasks.reduce((m,t)=>Math.max(m,t.order||0), -1);
  data.tasks.push({ id:'t'+Date.now()+Math.random().toString(16).slice(2), name, archived:false, order:maxOrder+1 });
  save(); render();
}
function archiveTask(id){ const t=data.tasks.find(t=>t.id===id); if(t){ t.archived=true; save(); render(); } }
function restoreTask(id){ const t=data.tasks.find(t=>t.id===id); if(t){ t.archived=false; save(); render(); } }
function deleteForever(id){
  if(confirm('Permanently delete this task and its history entry references? This cannot be undone.')){
    data.tasks = data.tasks.filter(t=>t.id!==id);
    save(); render();
  }
}
function moveTask(id, dir){
  const list = activeTasks();
  const idx = list.findIndex(t=>t.id===id);
  const swapIdx = dir==='up' ? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=list.length) return;
  const a = list[idx], b = list[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  save(); render();
}
function toggleTask(id){
  if(!isEditable(viewingDate)) return;
  if(!data.completions[viewingDate]) data.completions[viewingDate] = {};
  data.completions[viewingDate][id] = !data.completions[viewingDate][id];
  save(); render();
}

function computeStreak(){
  const threshold = data.settings.threshold;
  const grace = data.settings.graceDay;
  let streak = 0, graceUsed = 0, walked = 0;
  let d = new Date();
  while(true){
    const key = formatKey(d);
    const score = scoreForDate(key);
    const passes = score !== null && score >= threshold;
    const isToday = key === todayKey();
    if(passes){ streak++; }
    else if(isToday){ /* today incomplete doesn't break streak yet */ }
    else if(grace && graceUsed < 1){ graceUsed++; }
    else break;
    walked++;
    if(walked % 7 === 0) graceUsed = 0;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function bestStreak(){
  const threshold = data.settings.threshold;
  const grace = data.settings.graceDay;
  let best=0, cur=0, graceUsed=0;
  let d = new Date(); d.setDate(d.getDate()-365);
  for(let i=0;i<366;i++){
    const key = formatKey(d);
    const score = scoreForDate(key);
    const passes = score !== null && score >= threshold;
    if(passes){ cur++; best=Math.max(best,cur); }
    else if(grace && graceUsed<1){ graceUsed++; }
    else { cur=0; graceUsed=0; }
    if((i+1)%7===0) graceUsed=0;
    d.setDate(d.getDate()+1);
  }
  return best;
}
function avgOverDays(n){
  let total=0,count=0; let d=new Date();
  for(let i=0;i<n;i++){
    const score = scoreForDate(formatKey(d));
    if(score!==null){ total+=score; count++; }
    d.setDate(d.getDate()-1);
  }
  return count? Math.round((total/count)*100) : null;
}
function cellColor(score){
  if(score===null) return 'var(--surface-2)';
  if(score>=1) return 'var(--accent-green)';
  if(score>=0.6) return '#5C8A59';
  if(score>=0.3) return '#3E5C3E';
  return '#2E3A2E';
}
function buildHeatmap(){
  const days = 12*7; const cells=[];
  const end = new Date(); const start = new Date();
  start.setDate(end.getDate()-(days-1)); start.setDate(start.getDate()-start.getDay());
  const d = new Date(start);
  while(d<=end){
    const key = formatKey(d);
    const score = key<=todayKey() ? scoreForDate(key) : null;
    cells.push({ key, score, future: key>todayKey() });
    d.setDate(d.getDate()+1);
  }
  return cells;
}
function escapeHtml(s){ const div=document.createElement('div'); div.textContent=s; return div.innerHTML; }

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'daily-tracker-backup-'+todayKey()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.tasks || !parsed.completions) throw new Error('bad format');
      if(confirm('This replaces your current data with the imported backup. Continue?')){
        data = parsed;
        if(!data.settings) data.settings = { threshold:0.8, graceDay:true };
        data.tasks.forEach((t,i)=>{ if(t.order===undefined) t.order=i; if(t.archived===undefined) t.archived=false; });
        viewingDate = todayKey();
        save(); render();
      }
    }catch(err){ alert('Could not read this file as a valid backup.'); }
  };
  reader.readAsText(file);
}

function render(){
  const app = document.getElementById('app');
  const pct = Math.round((scoreForDate(viewingDate)||0)*100);
  const streak = computeStreak();
  const best = bestStreak();
  const avg7 = avgOverDays(7);
  const avg30 = avgOverDays(30);
  const cells = buildHeatmap();
  const editable = isEditable(viewingDate);
  const isToday = viewingDate === todayKey();
  const list = tasksForDate(viewingDate);

  let tasksHtml = '';
  if(list.length===0){
    tasksHtml = '<div class="empty">'+(isToday? 'No tasks yet. Add the things you want to do every day below.' : 'No tasks recorded for this day.')+'</div>';
  } else {
    const done = data.completions[viewingDate] || {};
    tasksHtml = list.map(t => {
      const isDone = !!done[t.id];
      const canToggle = editable;
      const orderCtrls = (isToday && !t.archived) ? `<div class="order-btns"><button data-up="${t.id}">▲</button><button data-down="${t.id}">▼</button></div>` : '';
      const delBtn = (isToday && !t.archived) ? `<button class="del" data-del="${t.id}">remove</button>` : '';
      const archTag = t.archived ? '<span class="tag">archived</span>' : '';
      return `<div class="task">
        ${orderCtrls}
        <div class="box ${isDone?'done':''} ${canToggle?'':'disabled'}" ${canToggle?`data-toggle="${t.id}"`:''}></div>
        <div class="name ${isDone?'done':''}" ${canToggle?`data-toggle="${t.id}"`:''}>${escapeHtml(t.name)}</div>
        ${archTag}${delBtn}
      </div>`;
    }).join('');
  }

  const heatmapHtml = cells.map(c => {
    const color = c.future ? 'transparent' : cellColor(c.score);
    const sel = c.key===viewingDate ? 'selected' : '';
    return `<div class="cell ${c.future?'future':''} ${sel}" style="background:${color}" title="${c.key}${c.score!==null?' — '+Math.round(c.score*100)+'%':''}" ${c.future?'':`data-day="${c.key}"`}></div>`;
  }).join('');

  const archived = archivedTasks();
  const archivedHtml = archived.length===0 ? '' : `
    <div class="archived-list ${showArchived?'':'hidden'}" style="${showArchived?'':'display:none'}">
      ${archived.map(t=>`<div class="task"><span style="flex:1;color:var(--text-dim)">${escapeHtml(t.name)}</span><button class="restore" data-restore="${t.id}">restore</button><button class="del" style="opacity:1" data-forget="${t.id}">delete forever</button></div>`).join('')}
    </div>`;

  app.innerHTML = `
    <div class="top">
      <div>
        <h1>Daily Tracker</h1>
        <div class="date">${dateLabelFor(viewingDate)}${isToday?' (today)':''}</div>
      </div>
      <div class="score">
        <div class="num">${pct}%</div>
        <div class="label">${isToday?'done today':'completed'}</div>
      </div>
    </div>

    <div class="nav-row">
      <button id="nav-prev">&larr; prev day</button>
      <button id="nav-next" ${isToday?'disabled':''}>next day &rarr;</button>
      ${!isToday? '<button id="nav-today">back to today</button>':''}
      <span class="badge ${editable?'':'readonly'}">${editable? 'editable':'read-only'}</span>
    </div>

    <div class="stat-row">
      <div class="stat-chip"><span class="k">streak</span><span class="v">${streak}d</span></div>
      <div class="stat-chip"><span class="k">best</span><span class="v">${best}d</span></div>
      <div class="stat-chip"><span class="k">7-day avg</span><span class="v">${avg7===null?'—':avg7+'%'}</span></div>
      <div class="stat-chip"><span class="k">30-day avg</span><span class="v">${avg30===null?'—':avg30+'%'}</span></div>
    </div>

    <p class="section-label">
      <span>${isToday? "Today's tasks" : 'Tasks that day'}</span>
      ${archived.length? `<button class="link" id="toggle-archived">${showArchived?'hide':'show'} archived (${archived.length})</button>`:''}
    </p>
    <div class="tasks">${tasksHtml}</div>
    ${archivedHtml}
    ${isToday? `<div class="add-row">
      <input type="text" id="new-task" placeholder="Add a daily task…" maxlength="80">
      <button id="add-btn">Add</button>
    </div>` : `<div class="past-note">Only the last 7 days can be edited. Add new tasks from today's view.</div>`}

    <p class="section-label" style="margin-top:24px;">Last 12 weeks — click a day to view it</p>
    <div class="heatmap-wrap"><div class="heatmap">${heatmapHtml}</div></div>
    <div class="legend">
      <span>less</span>
      <div class="cell" style="background:var(--surface-2)"></div>
      <div class="cell" style="background:#2E3A2E"></div>
      <div class="cell" style="background:#3E5C3E"></div>
      <div class="cell" style="background:#5C8A59"></div>
      <div class="cell" style="background:var(--accent-green)"></div>
      <span>more</span>
    </div>

    <div class="panel">
      <div class="panel-toggle" id="settings-toggle">
        <p class="section-label">Settings</p>
        <span style="color:var(--text-dim);font-size:0.8rem;">${showSettings?'▲':'▼'}</span>
      </div>
      <div class="panel-body" style="${showSettings?'':'display:none'}">
        <div class="settings-row">
          <span>Streak threshold</span>
          <span><input type="number" id="threshold-input" min="50" max="100" step="5" value="${Math.round(data.settings.threshold*100)}"> %</span>
        </div>
        <div class="settings-row">
          <span>Allow 1 grace day per week</span>
          <input type="checkbox" id="grace-input" ${data.settings.graceDay?'checked':''}>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-toggle" id="sync-toggle">
        <p class="section-label">Sync between devices</p>
        <span style="color:var(--text-dim);font-size:0.8rem;">${showSync?'▲':'▼'}</span>
      </div>
      <div class="panel-body" style="${showSync?'':'display:none'}">
        <div>Syncs your data through a private GitHub Gist on your account. Paste a GitHub token (classic, with only the <b>gist</b> scope) on each device.</div>
        <div class="add-row" style="padding-left:0;padding-right:0;">
          <input type="password" id="token-input" placeholder="GitHub token" value="${escapeHtml(sync.token)}" autocomplete="off">
          <button id="token-save">${sync.token?'Update':'Connect'}</button>
        </div>
        <div class="backup-row">
          <button id="sync-now-btn">Sync now</button>
          ${sync.token?'<button id="sync-off-btn">Disconnect</button>':''}
        </div>
        <div class="saved-note" id="sync-status">${escapeHtml(syncStatus || (sync.token?'connected':'not connected'))}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-toggle" id="backup-toggle">
        <p class="section-label">Backup &amp; restore</p>
        <span style="color:var(--text-dim);font-size:0.8rem;">${showBackup?'▲':'▼'}</span>
      </div>
      <div class="panel-body" style="${showBackup?'':'display:none'}">
        <div>Your data lives only in this browser. Export a backup regularly in case you clear your browser data or switch devices.</div>
        <div class="backup-row">
          <button id="export-btn">Export backup (.json)</button>
          <button id="import-btn">Import backup</button>
        </div>
        ${lastSavedAt? `<div class="saved-note">last saved ${lastSavedAt.toLocaleTimeString()}</div>`:''}
      </div>
    </div>

    <div class="install-hint" id="install-hint">
      Install this on your home screen for the full app-like experience.
      <br><button id="install-btn">Install app</button>
    </div>
  `;

  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => toggleTask(el.getAttribute('data-toggle'))));
  document.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => archiveTask(el.getAttribute('data-del'))));
  document.querySelectorAll('[data-restore]').forEach(el => el.addEventListener('click', () => restoreTask(el.getAttribute('data-restore'))));
  document.querySelectorAll('[data-forget]').forEach(el => el.addEventListener('click', () => deleteForever(el.getAttribute('data-forget'))));
  document.querySelectorAll('[data-up]').forEach(el => el.addEventListener('click', () => moveTask(el.getAttribute('data-up'),'up')));
  document.querySelectorAll('[data-down]').forEach(el => el.addEventListener('click', () => moveTask(el.getAttribute('data-down'),'down')));
  document.querySelectorAll('[data-day]').forEach(el => el.addEventListener('click', () => { viewingDate = el.getAttribute('data-day'); render(); }));

  const addBtn = document.getElementById('add-btn');
  if(addBtn){
    addBtn.addEventListener('click', () => { const i=document.getElementById('new-task'); addTask(i.value); i.value=''; i.focus(); });
    document.getElementById('new-task').addEventListener('keydown', (e) => { if(e.key==='Enter'){ addTask(e.target.value); e.target.value=''; } });
  }
  const toggleArch = document.getElementById('toggle-archived');
  if(toggleArch) toggleArch.addEventListener('click', () => { showArchived=!showArchived; render(); });

  document.getElementById('nav-prev').addEventListener('click', () => { const d=parseKey(viewingDate); d.setDate(d.getDate()-1); viewingDate=formatKey(d); render(); });
  const navNext = document.getElementById('nav-next');
  if(!navNext.disabled) navNext.addEventListener('click', () => { const d=parseKey(viewingDate); d.setDate(d.getDate()+1); viewingDate=formatKey(d); render(); });
  const navToday = document.getElementById('nav-today');
  if(navToday) navToday.addEventListener('click', () => { viewingDate=todayKey(); render(); });

  document.getElementById('settings-toggle').addEventListener('click', () => { showSettings=!showSettings; render(); });
  document.getElementById('backup-toggle').addEventListener('click', () => { showBackup=!showBackup; render(); });
  const thresholdInput = document.getElementById('threshold-input');
  if(thresholdInput) thresholdInput.addEventListener('change', (e) => {
    let v = parseInt(e.target.value,10); if(isNaN(v)) v=80; v=Math.min(100,Math.max(50,v));
    data.settings.threshold = v/100; save(); render();
  });
  const graceInput = document.getElementById('grace-input');
  if(graceInput) graceInput.addEventListener('change', (e) => { data.settings.graceDay = e.target.checked; save(); render(); });

  document.getElementById('sync-toggle').addEventListener('click', () => { showSync=!showSync; render(); });
  document.getElementById('token-save').addEventListener('click', () => {
    const v = document.getElementById('token-input').value.trim();
    if(!v) return;
    sync.token = v; sync.gistId = ''; saveSyncConfig(); syncNow();
  });
  document.getElementById('sync-now-btn').addEventListener('click', syncNow);
  const syncOff = document.getElementById('sync-off-btn');
  if(syncOff) syncOff.addEventListener('click', () => { sync = { token:'', gistId:'' }; saveSyncConfig(); setSyncStatus('not connected'); render(); });

  const exportBtn = document.getElementById('export-btn');
  if(exportBtn) exportBtn.addEventListener('click', exportData);
  const importBtn = document.getElementById('import-btn');
  if(importBtn) importBtn.addEventListener('click', () => document.getElementById('import-file').click());

  const hint = document.getElementById('install-hint');
  if(deferredPrompt){
    hint.classList.add('show');
    document.getElementById('install-btn').addEventListener('click', async () => {
      deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; hint.classList.remove('show');
    });
  }
}

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importDataFromFile(file);
  e.target.value = '';
});

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const hint = document.getElementById('install-hint');
  if(hint) hint.classList.add('show');
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') syncNow(); });

load();
loadSyncConfig();
render();
syncNow();
</script>
</body>
</html>
